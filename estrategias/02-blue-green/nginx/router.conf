# Router Blue-Green: decide a qué entorno va cada puerto.
# Los destinos se definen en activo/destinos.conf, que reescribe cambiar.sh.
include /etc/nginx/activo/destinos.conf;

# ───── PRODUCCIÓN: lo que ven los usuarios ─────
server {
    listen 80;
    # DNS interno de Docker; se resuelve en cada petición, así un entorno
    # puede reiniciarse o no existir sin que el router falle al arrancar.
    resolver 127.0.0.11 valid=5s ipv6=off;

    add_header X-Entorno $destino_produccion always;

    location / {
        proxy_pass http://$destino_produccion;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ───── PRUEBA: entorno inactivo, para validar antes del cambio ─────
server {
    listen 8082;
    resolver 127.0.0.11 valid=5s ipv6=off;

    add_header X-Entorno $destino_prueba always;

    location / {
        proxy_pass http://$destino_prueba;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
