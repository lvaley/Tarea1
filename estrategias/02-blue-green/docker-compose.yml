# ─────────────────────────────────────────────────────────────
# Estrategia 2: BLUE-GREEN
# Dos entornos completos e independientes (blue y green). Uno recibe a
# los usuarios; el otro recibe la versión nueva y se prueba sin afectar
# a nadie. El cambio de tráfico lo hace un Nginx "router" con un reload.
#
#   http://localhost:8081  → PRODUCCIÓN (entorno activo)
#   http://localhost:8082  → PRUEBA     (entorno inactivo, para validar)
#
# Versiones: BLUE_TAG y GREEN_TAG (las fijan los scripts).
# ─────────────────────────────────────────────────────────────
name: neko-bluegreen

x-backend: &backend-comun
  env_file: ../../backend.env            # credenciales: NO están en la imagen ni en git
  environment:
    NODE_ENV: production
    PORT: "5000"
    CLIENT_URL: http://localhost:8081,http://localhost:8082
  restart: unless-stopped

services:
  # ─────────── Entorno BLUE ───────────
  backend-blue:
    <<: *backend-comun
    image: neko-backend:${BLUE_TAG:-1.0.0}

  frontend-blue:
    image: neko-frontend:${BLUE_TAG:-1.0.0}
    environment:
      BACKEND_HOST: backend-blue          # cada frontend habla con SU backend
    depends_on:
      backend-blue:
        condition: service_healthy
    restart: unless-stopped

  # ─────────── Entorno GREEN ───────────
  backend-green:
    <<: *backend-comun
    image: neko-backend:${GREEN_TAG:-2.0.0}

  frontend-green:
    image: neko-frontend:${GREEN_TAG:-2.0.0}
    environment:
      BACKEND_HOST: backend-green
    depends_on:
      backend-green:
        condition: service_healthy
    restart: unless-stopped

  # ─────────── Router (balanceador) ───────────
  router:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"                          # producción
      - "8082:8082"                        # prueba del entorno inactivo
    volumes:
      - ./nginx/router.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/activo:/etc/nginx/activo:ro   # carpeta (no archivo) para que los cambios se vean
    restart: unless-stopped
