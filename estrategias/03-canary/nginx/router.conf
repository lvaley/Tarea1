# Router Canary: reparte las peticiones entre "estable" y "canary".
# El porcentaje se define en fase/pesos.conf, que reescribe porcentaje.sh.
include /etc/nginx/fase/pesos.conf;

# 1) Usuario con cookie de esta fase → se queda en su grupo (afinidad).
#    Sin cookie → se sortea según el porcentaje ($grupo_azar).
map $grupo_cookie $grupo_sin_forzar {
    ""      $grupo_azar;
    default $grupo_cookie;
}

# 2) Pruebas internas: la cabecera "X-Canary: siempre" fuerza la versión nueva.
map $http_x_canary $grupo {
    siempre canary;
    default $grupo_sin_forzar;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Evidencia: a qué grupo fue cada petición.
    add_header X-Grupo $grupo always;

    # Afinidad: el navegador recuerda su grupo durante esta fase. Evita que una
    # página cargue el HTML de una versión y el JavaScript de la otra.
    add_header Set-Cookie "$nombre_cookie=$grupo; Path=/; Max-Age=86400; SameSite=Lax" always;

    location / {
        proxy_pass http://frontend-$grupo;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
