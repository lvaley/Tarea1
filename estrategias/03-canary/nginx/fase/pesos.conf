# CANARY: 50%   (archivo generado por porcentaje.sh)

# Sorteo por petición: 50 % a la versión canary, el resto a la estable.
split_clients "${request_id}" $grupo_azar {
    50%  canary;
    *    estable;
}

# Cookie de afinidad propia de esta fase (al cambiar de fase se vuelve a sortear).
map $host $nombre_cookie { default neko_canary_50; }
map $cookie_neko_canary_50 $grupo_cookie {
    estable estable;
    canary  canary;
    default "";
}
