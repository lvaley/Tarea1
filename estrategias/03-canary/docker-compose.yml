# ─────────────────────────────────────────────────────────────
# Estrategia 3: CANARY
# La versión ESTABLE atiende a casi todos; la versión CANARY (nueva)
# recibe solo un porcentaje de los usuarios. Si se comporta bien, el
# porcentaje sube por fases (10 → 50 → 100) hasta reemplazar a la estable.
#
#   http://localhost:8083  → tienda (el router reparte el tráfico)
#
# Versiones: ESTABLE_TAG y CANARY_TAG (las fijan los scripts).
# ─────────────────────────────────────────────────────────────
name: neko-canary

x-backend: &backend-comun
  env_file: ../../backend.env            # credenciales: NO están en la imagen ni en git
  environment:
    NODE_ENV: production
    PORT: "5000"
    CLIENT_URL: http://localhost:8083
  restart: unless-stopped

services:
  # ─────────── Versión ESTABLE ───────────
  backend-estable:
    <<: *backend-comun
    image: neko-backend:${ESTABLE_TAG:-1.0.0}

  frontend-estable:
    image: neko-frontend:${ESTABLE_TAG:-1.0.0}
    environment:
      BACKEND_HOST: backend-estable
    depends_on:
      backend-estable:
        condition: service_healthy
    restart: unless-stopped

  # ─────────── Versión CANARY ───────────
  backend-canary:
    <<: *backend-comun
    image: neko-backend:${CANARY_TAG:-2.0.0}

  frontend-canary:
    image: neko-frontend:${CANARY_TAG:-2.0.0}
    environment:
      BACKEND_HOST: backend-canary
    depends_on:
      backend-canary:
        condition: service_healthy
    restart: unless-stopped

  # ─────────── Router (reparte el tráfico) ───────────
  router:
    image: nginx:1.27-alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx/router.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/fase:/etc/nginx/fase:ro      # carpeta (no archivo) para que los cambios se vean
    restart: unless-stopped
